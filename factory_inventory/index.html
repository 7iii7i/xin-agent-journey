<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工厂库存查询助手</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px; }
    h1 { color: #1f3a5f; }
    .box { background: #fff; border-radius: 10px; padding: 16px; height: 420px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; line-height: 1.6; white-space: pre-wrap; }
    .user { background: #e6f0ff; text-align: right; }
    .bot { background: #f1f1f1; }
    .input-row { display: flex; gap: 10px; margin-top: 14px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 20px; border: none; background: #1f3a5f; color: #fff; border-radius: 8px; cursor: pointer; font-size: 15px; }
    button:hover { background: #2c5282; }
    .hint { color: #888; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🏭 工厂库存查询助手</h1>
    <div class="box" id="box">
      <div class="msg bot">你好，我是库存助手。你可以问我：<br>· 有没有不锈钢螺丝？<br>· 轴承 6204 还有多少？<br>· 给冷轧钢板入库 100 公斤<br>· 从铜线出库 5 卷</div>
    </div>
    <div class="input-row">
      <input id="q" placeholder="用大白话问库存，例如：螺丝还有多少" onkeydown="if(event.key==='Enter')发送()" />
      <button onclick="发送()">发送</button>
    </div>
    <div class="hint">试试点上面那几句，或自己发挥。库存数据存在本地 SQLite，入库/出库会真实改数字。</div>
  </div>

  <script>
    const box = document.getElementById("box");
    const q = document.getElementById("q");

    function 添加(文本, 角色) {
      const d = document.createElement("div");
      d.className = "msg " + 角色;
      d.textContent = 文本;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    async function 发送() {
      const 问题 = q.value.trim();
      if (!问题) return;
      添加(问题, "user");
      q.value = "";
      添加("查询中…", "bot");
      try {
        const r = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 问题: 问题 })
        });
        const data = await r.json();
        box.lastChild.textContent = data.answer;
      } catch (e) {
        box.lastChild.textContent = "请求失败：" + e;
      }
    }
  </script>
</body>
</html>
